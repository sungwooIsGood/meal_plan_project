services:
  mongodb:
    image: mongo:7.0
    container_name: mealplan-mongo
    ports:
      - "27017:27017"
    volumes:
      - mealplan_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mealplan_mongo_data:
