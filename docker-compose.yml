# 전체 스택을 한 번에 띄운다: MongoDB + 백엔드(+ 선택적 프론트엔드)
#
#   docker compose up -d --build
#
# 프론트는 Vercel 에 배포돼 있으므로 기본은 mongodb + backend 만 띄우면 된다.
# 로컬에서 프론트까지 통째로 돌려보고 싶으면:  docker compose --profile fullstack up -d --build
#
# .env 파일(같은 폴더)로 값 주입 가능. 예시는 .env.example 참고.

services:
  mongodb:
    image: mongo:7.0
    container_name: mealplan-mongo
    restart: unless-stopped
    volumes:
      - mealplan_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 기본은 외부 노출 안 함(백엔드 컨테이너에서 내부 네트워크로만 접근).
    # 호스트에서 직접 보고 싶으면 아래 주석 해제.
    # ports:
    #   - "27017:27017"

  backend:
    build:
      context: ./meal_plan_backend
    container_name: mealplan-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # 컨테이너 네트워크 안에서는 서비스명(mongodb)으로 접근
      MONGODB_URI: mongodb://mongodb:27017/mealplan
      # 프론트(Vercel) 도메인을 CORS 허용 목록에 넣는다. 콤마로 여러 개 가능.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # OpenAI 분류기를 쓰려면 아래 값을 .env 로 주입 (기본은 규칙 기반).
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"

  # 선택: 로컬에서 프론트까지 함께 띄우고 싶을 때만 (--profile fullstack)
  frontend:
    build:
      context: ./meal_plan_frontend
    container_name: mealplan-frontend
    restart: unless-stopped
    profiles: ["fullstack"]
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mealplan_mongo_data:
